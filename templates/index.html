<!-- ══════════════════════════════════ SCRIPTS ══════════════════════════════════ -->
<script>
    let sessionId = '';
    let currentMode = 'rag';
    let isStreaming = false;
    let currentBotBubble = null;
    let currentBotDiv = null;
    let currentAnswerText = '';
    let currentAnswerMeta = null;
    let topK = 3;
    let abortController = null;
    let lastUserQuestion = '';

    marked.setOptions({ breaks: true, gfm: true });
    hljs.configure({ languages: ['python','bash','javascript','java','cpp','sql','json','yaml'] });

    // ── Theme ──────────────────────
    function getTheme() {
        return document.documentElement.getAttribute('data-theme') || 'dark';
    }
    function detectSystemTheme() { return window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; }
    function setTheme(t) {
        document.documentElement.setAttribute('data-theme', t);
        localStorage.setItem('ai-qa-theme', t);
        updateThemeIcon(t);
    }
    function toggleTheme() {
        setTheme(getTheme() === 'dark' ? 'light' : 'dark');
        document.querySelectorAll('.bubble pre code').forEach(b => hljs.highlightElement(b));
    }
    function updateThemeIcon(t) {
        const sun = document.getElementById('themeIconSun');
        const moon = document.getElementById('themeIconMoon');
        if (t === 'light') { sun.style.display = 'none'; moon.style.display = ''; }
        else { sun.style.display = ''; moon.style.display = 'none'; }
    }

    // ── Sidebar mobile ─────────────
    function toggleSidebar() {
        document.querySelector('.sidebar').classList.toggle('open');
        document.getElementById('sidebarOverlay').classList.toggle('active');
    }
    function closeSidebar() {
        document.querySelector('.sidebar').classList.remove('open');
        document.getElementById('sidebarOverlay').classList.remove('active');
    }

    // ── Init ───────────────────────
    document.addEventListener('DOMContentLoaded', () => {
        // Theme: localStorage > prefers-color-scheme > dark
        const saved = localStorage.getItem('ai-qa-theme');
        setTheme(saved || detectSystemTheme());
        // Listen for system theme changes if user hasn't set a preference
        window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', e => {
            if (!localStorage.getItem('ai-qa-theme')) setTheme(e.matches ? 'light' : 'dark');
        });

        initSession();
        loadSamples();
        renderConvList();

        const inp = document.getElementById('questionInput');
        inp.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey && !isStreaming) {
                e.preventDefault();
                askQuestion();
            }
        });
        // Auto-resize textarea
        inp.addEventListener('input', () => {
            inp.style.height = 'auto';
            inp.style.height = Math.min(inp.scrollHeight, 120) + 'px';
        });
        document.addEventListener('keydown', e => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); inp.focus(); }
        });
        document.getElementById('topKSlider').addEventListener('input', function() { topK = parseInt(this.value); });

        // Scroll-to-bottom visibility
        const chatArea = document.getElementById('chatArea');
        chatArea.addEventListener('scroll', () => {
            const btn = document.getElementById('scrollBottomBtn');
            const dist = chatArea.scrollHeight - chatArea.scrollTop - chatArea.clientHeight;
            btn.classList.toggle('visible', dist > 150);
        });
    });

    async function initSession(quiet) {
        try {
            const r = await fetch('/api/conversation/new', { method: 'POST' });
            const d = await r.json();
            sessionId = d.session_id;
        } catch(e) { /* ignore */ }
        if (!quiet) renderConvList();
        checkHealth();
    }

    async function checkHealth() {
        try {
            const r = await fetch('/api/health');
            const d = await r.json();
            if (currentMode === 'rag' && !d.llm_loaded) currentMode = 'retrieval';
            updateModeUI();
            document.getElementById('sideBackend').textContent = (d.llm_backend || 'local') === 'api' ? 'API 云端' : '本地模型';
            document.getElementById('sideMode').textContent = d.mode === 'rag' ? 'RAG 生成' : '检索匹配';
            document.getElementById('sideDevice').textContent = d.device || '检测中...';
            document.getElementById('sideQaCount').textContent = (d.qa_count || 0) + ' 条';
        } catch(e) {
            setTimeout(checkHealth, 3000);
        }
    }

    function updateModeUI() {
        const pill = document.getElementById('modePill');
        if (currentMode === 'rag') {
            pill.textContent = 'RAG 生成';
            pill.className = 'mode-pill rag';
        } else {
            pill.textContent = '检索匹配';
            pill.className = 'mode-pill retrieval';
        }
    }

    function toggleMode() {
        currentMode = currentMode === 'rag' ? 'retrieval' : 'rag';
        updateModeUI();
        toast(currentMode === 'rag' ? '已切换到 RAG 生成模式' : '已切换到检索匹配模式');
    }

    // ── Sessions ────────────────────
    async function newSession() {
        // Save current conversation before switching
        if (sessionId) saveConversation();
        try {
            const r = await fetch('/api/conversation/new', { method: 'POST' });
            const d = await r.json();
            sessionId = d.session_id;
            clearChatDOM();
            renderConvList();
            toast('已创建新对话', 'success');
        } catch(e) { toast('创建会话失败', 'error'); }
    }

    function clearChat() {
        // Also clear server-side
        if (sessionId) {
            fetch('/api/conversation/' + sessionId + '/clear', { method: 'POST' }).catch(() => {});
        }
        clearChatDOM();
        toast('对话已清屏', 'success');
    }

    function clearChatDOM() {
        const area = document.getElementById('chatArea');
        area.innerHTML = `<div class="empty-state">
            <div class="icon">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/>
                </svg>
            </div>
            <h2>康语 · 健康问答助手</h2>
            <p>基于 MacBERT + ChromaDB + BM25 + BGE Reranker + Qwen2.5 的 RAG 检索增强生成系统。覆盖日常养生与基础医学科普，输入健康相关问题，获得通俗易懂的知识解答。</p>
        </div>`;
        currentBotBubble = null; currentBotDiv = null; currentAnswerText = ''; currentAnswerMeta = null;
    }

    // ── Conversation persistence ────
    function getConvList() {
        try { return JSON.parse(localStorage.getItem('qa-conv-list') || '[]'); } catch(e) { return []; }
    }
    function saveConvList(list) {
        localStorage.setItem('qa-conv-list', JSON.stringify(list));
    }
    function upsertConvMeta() {
        if (!sessionId) return;
        const area = document.getElementById('chatArea');
        const msgs = area.querySelectorAll('.user-msg .bubble');
        // Derive title from first user question (max 25 chars)
        let title = '当前对话';
        if (msgs.length > 0) {
            const t = msgs[0].textContent.trim();
            title = t.length > 25 ? t.substring(0, 25) + '…' : t;
        }
        const msgCount = area.querySelectorAll('.user-msg').length;
        let list = getConvList();
        const existing = list.find(c => c.id === sessionId);
        const entry = { id: sessionId, title, time: Date.now(), msgCount };
        if (existing) {
            // Update in place
            Object.assign(existing, entry);
        } else {
            list.unshift(entry);
            // Keep max 50 conversations
            if (list.length > 50) list = list.slice(0, 50);
        }
        saveConvList(list);
        renderConvList();
    }
    function saveConversation() {
        if (!sessionId) return;
        const area = document.getElementById('chatArea');
        const messages = [];
        area.querySelectorAll('.user-msg, .bot-msg').forEach(el => {
            if (el.classList.contains('user-msg')) {
                messages.push({ role: 'user', text: el.querySelector('.bubble').textContent });
            } else {
                const bubble = el.querySelector('.bubble');
                messages.push({ role: 'assistant', html: bubble.innerHTML });
            }
        });
        if (messages.length > 0) localStorage.setItem('qa-conv-' + sessionId, JSON.stringify(messages.slice(-50)));
        upsertConvMeta();
    }
    function restoreConversation(sid) {
        const id = sid || sessionId;
        if (!id) return;
        const saved = localStorage.getItem('qa-conv-' + id);
        if (!saved) return;
        try {
            const messages = JSON.parse(saved);
            if (messages.length === 0) return;
            removeEmptyState();
            messages.forEach(m => {
                if (m.role === 'user') appendUserMessageDOM(m.text);
                else appendBotMessageDOM(m.html);
            });
            scrollToBottom();
        } catch(e) { /* ignore */ }
    }
    function switchConversation(sid) {
        // No-op: already viewing this conversation
        if (sid === sessionId || (!sid && !sessionId)) return;
        // Save current conversation before switching away
        if (sessionId) saveConversation();
        clearChatDOM();
        if (sid) {
            // Load a saved conversation
            sessionId = sid;
            restoreConversation(sid);
            renderConvList();
        } else {
            // Create fresh conversation
            sessionId = '';
            initSession(true).then(() => renderConvList());
            return; // initSession will call renderConvList
        }
        closeSidebar();
    }
    function deleteConversation(sid, e) {
        e.stopPropagation();
        if (!confirm('确定删除这条对话记录吗？')) return;
        localStorage.removeItem('qa-conv-' + sid);
        let list = getConvList().filter(c => c.id !== sid);
        saveConvList(list);
        if (sid === sessionId) {
            clearChatDOM();
            sessionId = '';
            initSession(true).then(() => renderConvList());
        } else {
            renderConvList();
        }
        toast('对话已删除');
    }
    function renderConvList() {
        const container = document.getElementById('convList');
        const list = getConvList();
        const label = document.querySelector('.conv-list-label');
        if (label) {
            label.innerHTML = list.length > 0 ? `历史对话 <span class="conv-list-count">${list.length} 条</span>` : '历史对话';
        }
        let html = '';
        const now = Date.now();
        // Always show current session at top
        const isCurrentSaved = sessionId && list.find(c => c.id === sessionId);
        html += `<div class="conv-item${isCurrentSaved ? '' : ' active'}" data-sid="" onclick="switchConversation('')">
            <span class="conv-dot"></span><span class="conv-title">当前对话</span>
        </div>`;
        // Then show saved conversations
        list.forEach(c => {
            const isActive = c.id === sessionId;
            // Skip the current session if it's already shown as "当前对话" above
            const timeStr = formatRelativeTime(c.time, now);
            html += `<div class="conv-item${isActive ? ' active' : ''}" data-sid="${c.id}" onclick="switchConversation('${c.id}')">
                <span class="conv-dot"></span>
                <span class="conv-info">
                    <span class="conv-title">${escHtml(c.title)}</span>
                    <span class="conv-time">${timeStr} · ${c.msgCount || 0} 条问答</span>
                </span>
                <button class="conv-del" onclick="deleteConversation('${c.id}', event)" title="删除">×</button>
            </div>`;
        });
        // If no saved conversations, show hint
        if (list.length === 0) {
            html += `<div style="font-size:11px;color:var(--text-muted);padding:8px 14px;text-align:center;">发送问题后自动保存</div>`;
        }
        container.innerHTML = html;
    }
    function formatRelativeTime(ts, now) {
        const diff = now - ts;
        if (diff < 60000) return '刚刚';
        if (diff < 3600000) return Math.floor(diff / 60000) + ' 分钟前';
        if (diff < 86400000) return Math.floor(diff / 3600000) + ' 小时前';
        if (diff < 604800000) return Math.floor(diff / 86400000) + ' 天前';
        return new Date(ts).toLocaleDateString('zh-CN');
    }
    function appendUserMessageDOM(text) {
        const area = document.getElementById('chatArea');
        const div = document.createElement('div');
        div.className = 'user-msg';
        div.innerHTML = `<div class="bubble">${escHtml(text)}</div>`;
        area.appendChild(div);
    }
    function appendBotMessageDOM(html) {
        const area = document.getElementById('chatArea');
        const div = document.createElement('div');
        div.className = 'bot-msg';
        div.innerHTML = `<div class="avatar">康</div><div class="msg-wrap"><div class="bubble">${html}</div></div>`;
        area.appendChild(div);
    }

    // ── Sample Questions ────────────
    async function loadSamples() {
        const c = document.getElementById('quickAsks');
        try {
            const r = await fetch('/api/sample_questions');
            const d = await r.json();
            if (d.samples && d.samples.length > 0) {
                c.innerHTML = d.samples.slice(0, 8).map(s =>
                    `<span class="quick-chip" onclick="askSample('${escHtml(s.question)}')" title="${escHtml(s.knowledge_point)}">
                        ${escHtml(s.question.length > 30 ? s.question.substring(0, 30) + '...' : s.question)}
                    </span>`
                ).join('');
            }
        } catch(e) {
            c.innerHTML = '<span class="quick-chip" onclick="loadSamples()" style="cursor:pointer;" title="点击重新加载">加载失败，点击重试</span>';
        }
    }

    function askSample(q) {
        document.getElementById('questionInput').value = q;
        askQuestion();
    }

    // ── Ask ─────────────────────────
    async function askQuestion(retryText) {
        const input = document.getElementById('questionInput');
        const question = retryText || input.value.trim();
        if (!question || isStreaming) return;

        isStreaming = true;
        lastUserQuestion = question;
        const btn = document.getElementById('sendBtn');
        const stopBtn = document.getElementById('stopBtn');
        btn.disabled = true; input.disabled = true;
        stopBtn.classList.add('visible');
        // Change send button to indicate busy state
        btn.style.opacity = '0.4';

        removeEmptyState();
        if (!retryText) {
            appendUserMessage(question);
            input.value = '';
            input.style.height = 'auto';
        }

        const botDiv = retryText ? createBotMessage() : createBotMessage();
        currentBotDiv = botDiv;
        currentBotBubble = botDiv.querySelector('.bubble');
        currentAnswerText = '';
        currentAnswerMeta = null;

        // Show RAG progress
        const progressEl = showProgress(botDiv);

        abortController = new AbortController();

        try {
            const res = await fetch('/api/ask/stream', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question, session_id: sessionId, top_k: topK, mode: currentMode }),
                signal: abortController.signal
            });

            const newSid = res.headers.get('X-Session-Id');
            if (newSid && newSid !== sessionId) { sessionId = newSid; saveConversation(); }

            updateProgress(progressEl, 2, '正在检索...');

            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';
            let firstTokenReceived = false;

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n');
                buffer = lines.pop() || '';
                for (const line of lines) {
                    if (!line.startsWith('data: ')) continue;
                    const dataStr = line.slice(6);
                    try {
                        if (!firstTokenReceived) {
                            updateProgress(progressEl, 3, '正在生成回答...');
                            firstTokenReceived = true;
                        }
                        handleSSE(JSON.parse(dataStr), botDiv);
                    } catch(_) {
                        if (dataStr && dataStr.length > 0 && dataStr !== '{}') {
                            if (!firstTokenReceived) { updateProgress(progressEl, 3, '正在生成回答...'); firstTokenReceived = true; }
                            appendToken(dataStr);
                        }
                    }
                }
            }
            hideProgress(progressEl);
        } catch(e) {
            hideProgress(progressEl);
            if (e.name !== 'AbortError') {
                const errMsg = e.message.includes('Failed to fetch') ? '网络连接失败，请检查网络后重试' : e.message;
                currentBotBubble.innerHTML = `<span style="color:var(--danger);">请求失败: ${escHtml(errMsg)}</span>
                    <button class="retry-btn" onclick="retryLast()"><svg viewBox="0 0 16 16" fill="currentColor"><path fill-rule="evenodd" d="M8 3a5 5 0 104.546 2.914.5.5 0 01.908-.417A6 6 0 118 2v1z"/><path d="M8 4.466V.534a.25.25 0 01.41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 018 4.466z"/></svg>重试</button>`;
                toast('请求失败: ' + errMsg, 'error');
            }
        }

        // Finalize
        if (currentAnswerMeta) {
            finalizeAnswer(botDiv, currentAnswerMeta);
        } else if (currentAnswerText) {
            currentBotBubble.innerHTML = marked.parse(currentAnswerText) + '</div>';
            enhanceCodeBlocks(currentBotBubble);
            addRetryButton(botDiv);
            addPerMessageDisclaimer(botDiv);
        }

        isStreaming = false;
        btn.disabled = false; input.disabled = false;
        btn.style.opacity = '1';
        stopBtn.classList.remove('visible');
        input.focus();
        abortController = null;
        saveConversation();
    }

    function stopGeneration() {
        if (abortController) { abortController.abort(); }
        const stopBtn = document.getElementById('stopBtn');
        stopBtn.classList.remove('visible');
        toast('已停止生成', 'success');
    }

    function retryLast() {
        if (currentBotDiv) currentBotDiv.remove();
        askQuestion(lastUserQuestion);
    }

    // ── RAG Progress ──────────────
    function showProgress(botDiv) {
        const wrap = botDiv.querySelector('.msg-wrap');
        const el = document.createElement('div');
        el.className = 'rag-progress visible';
        el.innerHTML = `<span class="step active">🔍 检索中</span><span class="step-arrow">→</span><span class="step">排序</span><span class="step-arrow">→</span><span class="step">生成</span>`;
        wrap.appendChild(el);
        return el;
    }
    function updateProgress(el, stepIdx, text) {
        const steps = el.querySelectorAll('.step');
        steps.forEach((s, i) => {
            if (i < stepIdx) s.className = 'step done';
            else if (i === stepIdx) s.className = 'step active';
            else s.className = 'step';
        });
        if (text) steps[stepIdx] && (steps[stepIdx].textContent = text);
    }
    function hideProgress(el) { if (el) { el.classList.remove('visible'); setTimeout(() => el.remove(), 300); } }

    function handleSSE(data, botDiv) {
        switch (data.type) {
            case 'token':
                appendToken(data.text);
                break;
            case 'done':
                currentAnswerText = data.answer || currentAnswerText;
                currentAnswerMeta = data;
                break;
            case 'error':
                currentBotBubble.innerHTML += `<span style="color:var(--danger);">${escHtml(data.text)}</span>`;
                break;
            case 'answer':
                currentBotBubble.innerHTML = marked.parse(data.text);
                enhanceCodeBlocks(currentBotBubble);
                break;
        }
    }

    function appendToken(text) {
        currentAnswerText += text;
        currentBotBubble.innerHTML = marked.parse(currentAnswerText) + '<span class="typing-cursor"></span>';
        enhanceCodeBlocks(currentBotBubble);
        scrollToBottom();
    }

    function finalizeAnswer(botDiv, data) {
        const bubble = botDiv.querySelector('.bubble');
        bubble.classList.remove('streaming');
        const answerContent = currentAnswerText || data.answer || '';
        let html = '';

        // Answer content
        html += `<div class="answer-content">${marked.parse(answerContent)}</div>`;

        // Score bar
        if (data.similarity != null) {
            const simPct = (data.similarity * 100).toFixed(1);
            html += `<div class="meta-section">
                <div class="score-bar">
                    <span>检索匹配度</span>
                    <div class="track"><div class="fill" style="width:${data.similarity*100}%;"></div></div>
                    <span style="font-weight:600;color:var(--blue-400);">${simPct}%</span>
                </div>`;
        }

        // Knowledge point
        if (data.knowledge_point) {
            html += `<div style="font-size:12px;color:var(--text-muted);margin-bottom:6px;font-weight:500;">知识点: ${escHtml(data.knowledge_point)}</div>`;
        }
        html += `</div>`;

        // Sources
        if (data.sources && data.sources.length > 0) {
            html += `<div class="source-chips">`;
            data.sources.forEach((s, i) => {
                const pct = (s.similarity * 100).toFixed(0);
                html += `<span class="source-chip" onclick="askSample('${escHtml(s.question)}')" title="点击重新搜索: ${escHtml(s.question)}">
                    <strong>[${i+1}]</strong> ${escHtml(s.knowledge_point)}&nbsp;<span style="opacity:0.7;">${pct}%</span>
                </span>`;
            });
            html += `</div>`;
        }

        // Retrieval source tag
        html += `<div class="retrieval-source-tag">
            <span class="src-icon"></span>
            检索来源：${data.mode === 'rag' ? 'RAG 生成 · Qwen2.5' : '向量检索 · MacBERT'}
        </div>`;

        // Per-message medical disclaimer
        html += `<div class="msg-disclaimer">⚠️ 健康提示：以上内容仅为科普参考，不能替代专业医疗诊断与治疗。如有不适或症状持续，请及时到正规医院就诊。紧急情况请拨打 <strong>120</strong>。</div>`;

        // Feedback + actions row
        html += `<div class="feedback-row">
            <button class="thumbs-up" onclick="submitFeedback(this, 'helpful')" title="有帮助" aria-label="有帮助">
                <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M8.864.73a2.976 2.976 0 01.946 1.455l.186.76a3.674 3.674 0 001.057 1.77l.322.29a.75.75 0 01-.416 1.306l-2.138.33a2.268 2.268 0 00-1.458.882c-.35.488-.517 1.073-.43 1.64l.074.482c.142.914.216 1.84.221 2.767v.05A2.51 2.51 0 015.188 15a.944.944 0 01-.944-.938v-3.9a2.75 2.75 0 00-4.067.728.85.85 0 01-.177.23v-7.09a.65.65 0 01.17-.126 6.25 6.25 0 015.577-.652c.31.066.73.222 1.085.41.172.092.631.415 1.061.721.543.386 1.113.79 1.177.85z"/></svg>有帮助
            </button>
            <button class="thumbs-down" onclick="submitFeedback(this, 'not_helpful')" title="无帮助" aria-label="无帮助">
                <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M7.136.73a2.976 2.976 0 00-.946 1.455l-.186.76a3.674 3.674 0 01-1.057 1.77l-.322.29a.75.75 0 00.416 1.306l2.138.33a2.268 2.268 0 011.458.882c.35.488.517 1.073.43 1.64l-.074.482c-.142.914-.216 1.84-.221 2.767v.05A2.51 2.51 0 0010.812 15a.944.944 0 00.944-.938v-3.9a2.75 2.75 0 014.067.728.85.85 0 00.177.23v-7.09a.65.65 0 00-.17-.126 6.25 6.25 0 00-5.577-.652c-.31.066-.73.222-1.085.41-.172.092-.631.415-1.061.721-.543.386-1.113.79-1.177.85z"/></svg>无帮助
            </button>
            <span style="flex:1;"></span>
            <button class="retry-btn" onclick="retryLast()" title="重新生成" aria-label="重新生成">
                <svg viewBox="0 0 16 16" fill="currentColor"><path fill-rule="evenodd" d="M8 3a5 5 0 104.546 2.914.5.5 0 01.908-.417A6 6 0 118 2v1z"/><path d="M8 4.466V.534a.25.25 0 01.41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 018 4.466z"/></svg>重试
            </button>
            <button onclick="copyAnswer(this)" title="复制答案" aria-label="复制答案">
                <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 010 1.5h-1.5a.25.25 0 00-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 00.25-.25v-1.5a.75.75 0 011.5 0v1.5A1.75 1.75 0 019.25 16h-7.5A1.75 1.75 0 010 14.25v-7.5z"/><path d="M5 1.75C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0114.25 11h-7.5A1.75 1.75 0 015 9.25v-7.5zm1.75-.25a.25.25 0 00-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 00.25-.25v-7.5a.25.25 0 00-.25-.25h-7.5z"/></svg>复制
            </button>
        </div>`;

        bubble.innerHTML = html;
        enhanceCodeBlocks(bubble);
        addPerMessageDisclaimer(botDiv); // already included inline
        addRetryButton(botDiv); // already included inline
        scrollToBottom();
    }

    function addRetryButton(botDiv) {
        // Already included in finalizeAnswer inline; only used as fallback
        const bubble = botDiv.querySelector('.bubble');
        if (!bubble.querySelector('.retry-btn')) {
            const btn = document.createElement('button');
            btn.className = 'retry-btn';
            btn.onclick = retryLast;
            btn.setAttribute('aria-label', '重新生成');
            btn.innerHTML = `<svg viewBox="0 0 16 16" fill="currentColor" width="12"><path fill-rule="evenodd" d="M8 3a5 5 0 104.546 2.914.5.5 0 01.908-.417A6 6 0 118 2v1z"/><path d="M8 4.466V.534a.25.25 0 01.41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 018 4.466z"/></svg>重试`;
            bubble.appendChild(btn);
        }
    }

    function addPerMessageDisclaimer(botDiv) {
        const bubble = botDiv.querySelector('.bubble');
        if (!bubble.querySelector('.msg-disclaimer')) {
            const disc = document.createElement('div');
            disc.className = 'msg-disclaimer';
            disc.innerHTML = '⚠️ 健康提示：以上内容仅为科普参考，不能替代专业医疗诊断与治疗。如有不适或症状持续，请及时到正规医院就诊。紧急情况请拨打 <strong>120</strong>。';
            bubble.appendChild(disc);
        }
    }

    function addRetrievalTag(botDiv) {
        const bubble = botDiv.querySelector('.bubble');
        const tag = document.createElement('div');
        tag.className = 'retrieval-source-tag';
        tag.innerHTML = '<span class="src-icon"></span>检索来源：' + (currentMode === 'rag' ? 'RAG 生成 · Qwen2.5' : '向量检索 · MacBERT');
        bubble.appendChild(tag);
    }

    function addFeedbackButtons(botDiv) {
        const bubble = botDiv.querySelector('.bubble');
        const row = document.createElement('div');
        row.className = 'feedback-row';
        row.innerHTML = `
            <button class="thumbs-up" onclick="submitFeedback(this, 'helpful')">有帮助</button>
            <button class="thumbs-down" onclick="submitFeedback(this, 'not_helpful')">无帮助</button>
            <span style="flex:1;"></span>
            <button onclick="copyAnswer(this)">复制</button>`;
        bubble.appendChild(row);
    }

    // ── UI helpers ───────────────────
    function removeEmptyState() {
        const es = document.querySelector('.empty-state');
        if (es) es.remove();
    }

    function appendUserMessage(text) {
        lastUserQuestion = text;
        appendUserMessageDOM(text);
        scrollToBottom();
    }

    function createBotMessage() {
        const area = document.getElementById('chatArea');
        const div = document.createElement('div');
        div.className = 'bot-msg';
        div.innerHTML = `<div class="avatar">康</div><div class="msg-wrap"><div class="bubble streaming"><div class="loading-dots"><span></span><span></span><span></span></div></div></div>`;
        area.appendChild(div);
        scrollToBottom();
        return div;
    }

    function scrollToBottom() {
        const area = document.getElementById('chatArea');
        requestAnimationFrame(() => { area.scrollTop = area.scrollHeight; });
    }

    // ── Code Block Enhancement ──────
    function enhanceCodeBlocks(el) {
        el.querySelectorAll('pre').forEach(pre => {
            // Skip if already enhanced
            if (pre.querySelector('.code-toolbar')) return;

            const code = pre.querySelector('code');
            const lang = code ? detectLanguage(code) : 'python';

            // Highlight
            if (code) hljs.highlightElement(code);

            // Wrap content
            const wrapper = document.createElement('div');
            wrapper.style.position = 'relative';

            // Toolbar
            const toolbar = document.createElement('div');
            toolbar.className = 'code-toolbar';
            toolbar.innerHTML = `
                <span class="lang-tag">${lang}</span>
                <div class="tb-actions">
                    <button class="tb-btn" onclick="copyCodeBlock(this)" title="复制代码">
                        <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 010 1.5h-1.5a.25.25 0 00-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 00.25-.25v-1.5a.75.75 0 011.5 0v1.5A1.75 1.75 0 019.25 16h-7.5A1.75 1.75 0 010 14.25v-7.5z"/><path d="M5 1.75C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0114.25 11h-7.5A1.75 1.75 0 015 9.25v-7.5zm1.75-.25a.25.25 0 00-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 00.25-.25v-7.5a.25.25 0 00-.25-.25h-7.5z"/></svg>
                        复制
                    </button>
                    <button class="tb-btn" onclick="toggleCodeBlock(this)" title="收起代码">
                        <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M3.854 2.146a.5.5 0 10-.708.708L6.293 6l-3.147 3.146a.5.5 0 10.708.708L7.707 6 3.854 2.146z"/></svg>
                    </button>
                </div>`;

            // Move code into wrapper
            pre.parentNode.insertBefore(wrapper, pre);
            wrapper.appendChild(toolbar);
            wrapper.appendChild(pre);
        });
    }

    function detectLanguage(code) {
        const text = code.textContent || '';
        const cls = code.className || '';
        if (cls.includes('python') || text.includes('def ') || text.includes('import ') || text.includes('print(')) return 'python';
        if (cls.includes('javascript') || cls.includes('js') || text.includes('const ') || text.includes('function ')) return 'javascript';
        if (cls.includes('bash') || cls.includes('sh') || text.includes('#!/bin/bash')) return 'bash';
        if (cls.includes('sql') || text.match(/SELECT|INSERT|CREATE/i)) return 'sql';
        if (cls.includes('json') || text.match(/^\s*[\[{]/)) return 'json';
        return 'python';
    }

    function copyCodeBlock(btn) {
        const pre = btn.closest('.code-toolbar').nextElementSibling;
        const code = pre ? pre.textContent : '';
        navigator.clipboard.writeText(code).then(() => {
            btn.classList.add('copied');
            btn.innerHTML = `<svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M13.78 4.22a.75.75 0 010 1.06l-7.25 7.25a.75.75 0 01-1.06 0L2.22 9.28a.75.75 0 011.06-1.06L6 10.94l6.72-6.72a.75.75 0 011.06 0z"/></svg> 已复制`;
            toast('代码已复制到剪贴板', 'success');
            setTimeout(() => {
                btn.classList.remove('copied');
                btn.innerHTML = `<svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 010 1.5h-1.5a.25.25 0 00-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 00.25-.25v-1.5a.75.75 0 011.5 0v1.5A1.75 1.75 0 019.25 16h-7.5A1.75 1.75 0 010 14.25v-7.5z"/><path d="M5 1.75C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0114.25 11h-7.5A1.75 1.75 0 015 9.25v-7.5zm1.75-.25a.25.25 0 00-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 00.25-.25v-7.5a.25.25 0 00-.25-.25h-7.5z"/></svg> 复制`;
            }, 2000);
        }).catch(() => toast('复制失败', 'error'));
    }

    function toggleCodeBlock(btn) {
        const pre = btn.closest('.code-toolbar').nextElementSibling;
        if (!pre) return;
        const icon = btn.querySelector('svg');
        if (pre.style.display === 'none') {
            pre.style.display = '';
            icon.innerHTML = '<path d="M3.854 2.146a.5.5 0 10-.708.708L6.293 6l-3.147 3.146a.5.5 0 10.708.708L7.707 6 3.854 2.146z"/>';
            btn.childNodes[1] && (btn.childNodes[1].textContent = ' 收起');
        } else {
            pre.style.display = 'none';
            icon.innerHTML = '<path d="M4.646 1.646a.5.5 0 01.708 0l3.5 3.5a.5.5 0 010 .708l-3.5 3.5a.5.5 0 01-.708-.708L7.793 5.5 4.646 2.354a.5.5 0 010-.708z"/>';
            btn.childNodes[1] && (btn.childNodes[1].textContent = ' 展开');
        }
    }

    function copyAnswer(btn) {
        const bubble = btn.closest('.bubble');
        // Only copy the answer content, not metadata
        const answerEl = bubble.querySelector('.answer-content');
        const text = answerEl ? answerEl.textContent : (currentAnswerText || bubble.textContent || '');
        navigator.clipboard.writeText(text.trim()).then(() => {
            btn.innerHTML = '已复制';
            toast('答案已复制到剪贴板', 'success');
            setTimeout(() => { btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 010 1.5h-1.5a.25.25 0 00-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 00.25-.25v-1.5a.75.75 0 011.5 0v1.5A1.75 1.75 0 019.25 16h-7.5A1.75 1.75 0 010 14.25v-7.5z"/><path d="M5 1.75C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0114.25 11h-7.5A1.75 1.75 0 015 9.25v-7.5zm1.75-.25a.25.25 0 00-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 00.25-.25v-7.5a.25.25 0 00-.25-.25h-7.5z"/></svg>复制'; }, 2000);
        }).catch(() => toast('复制失败', 'error'));
    }

    // ── Feedback ────────────────────
    async function submitFeedback(btn, rating) {
        const bubble = btn.closest('.bubble');
        const botDiv = btn.closest('.bot-msg');
        const prev = botDiv?.previousElementSibling;
        const question = prev?.querySelector('.bubble')?.textContent || '';
        const answerText = currentAnswerText || bubble.textContent || '';

        try {
            await fetch('/api/feedback', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    question, answer: answerText.substring(0, 500),
                    rating, session_id: sessionId, mode: currentMode
                })
            });
            const row = btn.parentElement;
            row.querySelectorAll('button').forEach(b => { b.disabled = true; b.classList.remove('voted'); });
            btn.classList.add('voted');
            toast(rating === 'helpful' ? '感谢反馈！' : '感谢反馈，我们会改进', 'success');
        } catch(e) { /* ignore */ }
    }

    // ── Toast ───────────────────────
    function toast(msg, type) {
        const container = document.getElementById('toastContainer');
        const el = document.createElement('div');
        el.className = 'toast' + (type ? ' ' + type : '');
        el.textContent = msg;
        el.setAttribute('role', 'status');
        el.setAttribute('aria-live', 'polite');
        container.appendChild(el);
        // Auto-remove with animation
        setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateX(100%)'; setTimeout(() => el.remove(), 300); }, 3200);
    }

    // ── Escape helpers ──────────────
    function escHtml(text) {
        const d = document.createElement('div');
        d.textContent = text;
        return d.innerHTML;
    }

    function escAttr(text) {
        return text.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'\\"');
    }
</script>
</body>
